name: Release ctxprof (PyPI)

# Publishes the ctxprof package to PyPI when you push a version tag
# (e.g. `git tag v0.2.0 && git push origin v0.2.0`).
#
# Uses PyPI Trusted Publishing (OIDC) — NO API token/secret required. One-time
# setup on PyPI (https://pypi.org/manage/project/ctxprof/settings/publishing/):
#   - PyPI Project Name: ctxprof
#   - Owner:             kraftaa
#   - Repository name:   ctxprof
#   - Workflow name:     release.yml
#   - Environment name:  pypi
# The project already exists on PyPI, so add this as a NEW trusted publisher
# under the project's publishing settings (it is no longer a "pending" publisher).
# To dry-run against TestPyPI first, set `repository-url` on the publish step to
# https://test.pypi.org/legacy/.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verify it installs and runs
        run: |
          python -m pip install dist/*.whl
          ctx version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for OIDC Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
