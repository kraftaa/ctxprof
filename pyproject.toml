[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-context-tools"
version = "0.1.0"
description = "Live dashboard and offline context/cache audit for Claude Code sessions"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Maria Dubyaga" }]
keywords = ["claude", "claude-code", "statusline", "tokens", "cache", "observability"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kraftaa/claude_workflow"
Source = "https://github.com/kraftaa/claude_workflow/tree/main/claude-context-tools"

[project.scripts]
ctx = "claude_context_tools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["claude_context_tools"]
artifacts = ["claude_context_tools/data/*.sh"]

[tool.hatch.build.targets.sdist]
include = [
    "claude_context_tools",
    "tests",
    "README.md",
    "LICENSE",
]
